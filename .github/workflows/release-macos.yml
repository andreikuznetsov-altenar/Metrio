name: Release macOS

# The single owner of Metrio releases: version bump, release commit, the signed + notarized macOS
# builds (Apple Silicon + Intel), the Windows x64 build, updater archives, DMGs, latest.json, tag and
# GitHub Release all happen in this one workflow. The version is planned ONCE (job `prepare`); every
# build job checks out that exact release commit and `publish` creates the one tag/release.
# Triggers: push to main (planned, usually a no-op for docs/test/CI-only pushes) and manual
# workflow_dispatch. Manual dispatch has two modes: `rc` (default) builds the same signed + notarized
# artifacts from `target_ref` and uploads them ONLY as Actions artifacts: no version bump, no push to
# main, no tag, no GitHub Release, no latest.json. `release` is the original manual release. There is deliberately NO `v*` tag trigger: the tag is created here, so a tag push can never
# start a competing build. See docs/releasing.md.
#
# Required repository secrets (names only; values never appear in this file):
#   Updater (permanent key):  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#   Developer ID signing:     APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD
#   Notarization (API key):   APPLE_API_ISSUER, APPLE_API_KEY (key id), APPLE_API_KEY_CONTENT (.p8 text)
on:
  # Every push to main is planned; only pushes that can change the packaged app release
  # (docs-only pushes and the generated "[skip release]" commit never do).
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
    inputs:
      mode:
        description: "rc = build-only candidate (Actions artifacts, publishes nothing); release = publish a release"
        type: choice
        options: [rc, release]
        default: rc
      target_ref:
        description: "rc only: commit SHA (full or abbreviated), branch or tag to build exactly"
        type: string
        default: ""
      force:
        description: "release mode: release even if only documentation/tests/automation changed"
        type: boolean
        default: true

permissions:
  contents: write

# Serialized: never two releases at once, and a release that has started is never cancelled.
concurrency:
  group: metrio-release-main
  cancel-in-progress: false

env:
  REPO: ${{ github.repository }}
  SIGNING_IDENTITY: "Developer ID Application: Andrei Kuznetsov (V36L7T43H8)"

jobs:
  # ---------------------------------------------------------------- plan + test + version commit
  prepare:
    runs-on: macos-14
    timeout-minutes: 60
    outputs:
      should_release: ${{ steps.plan.outputs.should_release }}
      should_build: ${{ steps.intent.outputs.should_build }}
      should_publish: ${{ steps.intent.outputs.should_publish }}
      rc: ${{ steps.rc.outputs.rc }}
      reason: ${{ steps.plan.outputs.reason }}
      version: ${{ steps.rc.outputs.version || steps.plan.outputs.version }}
      previous_tag: ${{ steps.plan.outputs.previous_tag }}
      sha: ${{ steps.rc.outputs.sha || steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      # Manual dispatch only: validate the inputs; in rc mode resolve target_ref to ONE full SHA, print it
      # and check that exact commit out. Changes no public state (see scripts/ci/resolve-rc-target.sh).
      - name: Validate dispatch inputs and resolve the RC source commit
        id: rc
        if: github.event_name == 'workflow_dispatch'
        env:
          MODE: ${{ inputs.mode }}
          TARGET_REF: ${{ inputs.target_ref }}
        run: bash scripts/ci/resolve-rc-target.sh "$MODE" "$TARGET_REF"

      - name: Plan release (version, should_release)
        id: plan
        if: steps.rc.outputs.rc != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force }}
        run: |
          git fetch --tags --force origin
          gh release list --limit 200 --json tagName,isDraft,isPrerelease > "$RUNNER_TEMP/releases.json"
          ARGS=()
          if [ "$FORCE" = "true" ]; then ARGS+=(--force); fi
          node scripts/plan-release.mjs --releases "$RUNNER_TEMP/releases.json" "${ARGS[@]}"

      # Build/publish intent. rc: build=true, publish=false. Otherwise both follow the release plan.
      - name: Resolve build intent
        id: intent
        env:
          RC: ${{ steps.rc.outputs.rc }}
          PLANNED: ${{ steps.plan.outputs.should_release }}
          RC_SHA: ${{ steps.rc.outputs.sha }}
          RC_VERSION: ${{ steps.rc.outputs.version }}
        run: |
          if [ "$RC" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"; echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "RC build of $RC_SHA (version $RC_VERSION): build only, nothing is published."
          elif [ "$PLANNED" = "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"; echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_build=false" >> "$GITHUB_OUTPUT"; echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Nothing to release
        if: steps.intent.outputs.should_build != 'true'
        run: echo "No release created — ${{ steps.plan.outputs.reason }}"

      - name: Check required secrets are configured (names only)
        if: steps.intent.outputs.should_build == 'true'
        env:
          S1: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          S2: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          S3: ${{ secrets.APPLE_CERTIFICATE }}
          S4: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S5: ${{ secrets.APPLE_API_ISSUER }}
          S6: ${{ secrets.APPLE_API_KEY }}
          S7: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          missing=0
          check() { if [ -z "$2" ]; then echo "::error::Missing repository secret $1"; missing=1; fi; }
          check TAURI_SIGNING_PRIVATE_KEY "$S1"
          check TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$S2"
          check APPLE_CERTIFICATE "$S3"
          check APPLE_CERTIFICATE_PASSWORD "$S4"
          check APPLE_API_ISSUER "$S5"
          check APPLE_API_KEY "$S6"
          check APPLE_API_KEY_CONTENT "$S7"
          exit $missing

      - uses: actions/setup-node@v4
        if: steps.intent.outputs.should_build == 'true'
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        if: steps.intent.outputs.should_build == 'true'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        if: steps.intent.outputs.should_build == 'true'
        run: npm ci

      - name: Test gate
        if: steps.intent.outputs.should_build == 'true'
        run: |
          npx tsc --noEmit
          npm run verify:design-system
          npm test
          npm run build
          (cd src-tauri && cargo check && cargo test)

      - name: Restore known generated report, require a clean tree
        if: steps.intent.outputs.should_build == 'true'
        run: bash scripts/ci/restore-generated-report.sh

      - name: Version bump + release commit
        if: steps.intent.outputs.should_publish == 'true'
        id: commit
        env:
          VERSION: ${{ steps.plan.outputs.version }}
        run: |
          # The test gate must not have modified tracked files; the release commit may only contain version changes.
          if ! git diff --quiet; then
            echo "::error::Tracked files changed during the test gate:"; git status --short; exit 1
          fi
          node scripts/prepare-release-version.mjs "$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json CHANGELOG.md src/config/build.ts \
                  src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "Version sources already at $VERSION (retry of an unreleased version commit)."
          else
            git commit -m "RELEASE Metrio v$VERSION [skip release]"
            git push origin HEAD:refs/heads/main
          fi
          git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "::error::main moved during the release; refusing to build a stale commit"
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"


  # ---------------------------------------------------------------- macOS (Apple Silicon + Intel)
  macos:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: macos-14
    timeout-minutes: 120
    env:
      SIGNING_IDENTITY: "Developer ID Application: Andrei Kuznetsov (V36L7T43H8)"
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Install dependencies
        run: npm ci

      - name: Import Developer ID certificate into an ephemeral keychain
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/metrio-build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "METRIO_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/DeveloperIDG2CA.cer"
          security import "$RUNNER_TEMP/DeveloperIDG2CA.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN" | tee "$RUNNER_TEMP/identities.txt"
          grep -q "$SIGNING_IDENTITY" "$RUNNER_TEMP/identities.txt" || { echo "::error::Expected signing identity not found in keychain"; exit 1; }

      - name: Write App Store Connect API key
        env:
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s' "$APPLE_API_KEY_CONTENT" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "APPLE_API_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Both architectures are built from the exact same release commit. Apple Silicon is built
      # and fully verified first; Intel
      # (x86_64-apple-darwin) is cross-built on the same runner. Each architecture is verified with
      # lipo, signed, notarized, stapled and gets its own updater archive + signature + DMG.
      - name: Package macOS Apple Silicon (aarch64)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/package-target.sh aarch64

      - name: Package macOS Intel (x86_64)
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: bash scripts/ci/package-target.sh x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-macos
          path: release-assets/
          if-no-files-found: error

      - name: Cleanup signing material
        if: always()
        run: |
          if [ -n "${METRIO_KEYCHAIN:-}" ] && [ -f "$METRIO_KEYCHAIN" ]; then security delete-keychain "$METRIO_KEYCHAIN" || true; fi
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP"/certificate.p12 || true

  # ---------------------------------------------------------------- Windows x64
  windows:
    needs: prepare
    if: needs.prepare.outputs.should_build == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      # Authenticode: NO Windows code-signing certificate/service is configured, so the installer and
      # app are UNSIGNED (SmartScreen will warn). The `.sig` is the Tauri UPDATER signature (minisign,
      # the same permanent key as macOS); it is NOT Authenticode.
      - name: Build the Windows NSIS installer (x86_64-pc-windows-msvc)
        env:
          BUILD_CHANNEL: production
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --target x86_64-pc-windows-msvc --bundles nsis

      - name: Stage the installer + updater signature
        run: |
          SRC=src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          ls -l "$SRC"
          SETUP="$(ls $SRC/*-setup.exe | head -1)"
          test -s "$SETUP.sig"
          mkdir -p release-assets
          cp "$SETUP" "release-assets/Metrio_${RELEASE_VERSION}_x86_64-setup.exe"
          cp "$SETUP.sig" "release-assets/Metrio_${RELEASE_VERSION}_x86_64-setup.exe.sig"
          ls -l release-assets

      - name: Windows runtime QA on the exact installer (install, launch, UI, updater)
        continue-on-error: true
        run: |
          SETUP_WIN="$(cygpath -w "$PWD/release-assets/Metrio_${RELEASE_VERSION}_x86_64-setup.exe")"
          node scripts/windows-qa.mjs smoke --installer "$SETUP_WIN" --expect-version "$RELEASE_VERSION" --expect-sha "${RELEASE_SHA:0:7}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-qa-report
          path: qa-out/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets-windows
          path: release-assets/
          if-no-files-found: error

  # ---------------------------------------------------------------- latest.json, tag, release
  publish:
    needs: [prepare, macos, windows]
    # rc builds never publish: no tag, no GitHub Release, no latest.json.
    if: needs.prepare.outputs.should_publish == 'true'
    runs-on: macos-14
    timeout-minutes: 60
    env:
      REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: release-assets
          merge-multiple: true

      - name: Verify updater signatures for every platform, tamper test
        run: |
          ls -l release-assets
          node scripts/verify-updater-artifacts.mjs release-assets
          node scripts/verify-updater-tamper.mjs release-assets

      - name: Generate and validate latest.json; record hashes
        run: |
          METRIO_RELEASE_REPO="$REPO" METRIO_RELEASE_TAG="v$RELEASE_VERSION" \
            METRIO_RELEASE_NOTES="Metrio $RELEASE_VERSION" \
            node scripts/generate-update-manifest.mjs release-assets
          node -e 'JSON.parse(require("fs").readFileSync("release-assets/latest.json","utf8"))'
          node scripts/verify-updater-artifacts.mjs release-assets
          test "$(node -p 'JSON.parse(require("fs").readFileSync("release-assets/latest.json","utf8")).version')" = "$RELEASE_VERSION"
          ls -l release-assets
          grep -q '"darwin-aarch64"' release-assets/latest.json
          grep -q '"darwin-x86_64"' release-assets/latest.json
          grep -q '"windows-x86_64"' release-assets/latest.json
          (cd release-assets && shasum -a 256 *.dmg *.tar.gz *.sig latest.json | tee "$RUNNER_TEMP/SHA256SUMS.txt")

      - name: Tag, publish release, verify published bytes, then switch clients over
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
        run: |
          TAG="v$RELEASE_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on origin; refusing to move or reuse it"; exit 1
          fi
          git tag -a "$TAG" "$RELEASE_SHA" -m "Metrio $RELEASE_VERSION"
          git push origin "refs/tags/$TAG"
          echo "METRIO_TAG_PUSHED=$TAG" >> "$GITHUB_ENV"

          # Compact user-facing notes: product commit subjects only (RELEASE/CI/TEST/DOCS are filtered).
          node scripts/generate-release-notes.mjs --version "$RELEASE_VERSION" --to "$RELEASE_SHA" \
            ${PREVIOUS_TAG:+--from "$PREVIOUS_TAG"} > "$RUNNER_TEMP/notes.md"

          # latest.json is the switch clients follow, so it is uploaded LAST, after the
          # binaries are re-downloaded and compared byte-for-byte.
          gh release create "$TAG" --verify-tag --latest=false --title "Metrio $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            "release-assets/Metrio_${RELEASE_VERSION}_aarch64.dmg" "release-assets/Metrio_${RELEASE_VERSION}_x86_64.dmg" \
            release-assets/Metrio_aarch64.app.tar.gz release-assets/Metrio_aarch64.app.tar.gz.sig \
            release-assets/Metrio_x86_64.app.tar.gz release-assets/Metrio_x86_64.app.tar.gz.sig \
            "release-assets/Metrio_${RELEASE_VERSION}_x86_64-setup.exe" "release-assets/Metrio_${RELEASE_VERSION}_x86_64-setup.exe.sig"
          echo "METRIO_RELEASE_CREATED=$TAG" >> "$GITHUB_ENV"

          rm -rf verify-download && mkdir verify-download
          gh release download "$TAG" --dir verify-download
          for f in "Metrio_${RELEASE_VERSION}_aarch64.dmg" "Metrio_${RELEASE_VERSION}_x86_64.dmg" \
                   Metrio_aarch64.app.tar.gz Metrio_aarch64.app.tar.gz.sig Metrio_x86_64.app.tar.gz Metrio_x86_64.app.tar.gz.sig \
                   "Metrio_${RELEASE_VERSION}_x86_64-setup.exe" "Metrio_${RELEASE_VERSION}_x86_64-setup.exe.sig"; do
            cmp "release-assets/$f" "verify-download/$f"
            echo "published $f: $(stat -f %z "verify-download/$f") bytes, sha256 $(shasum -a 256 "verify-download/$f" | cut -d' ' -f1)"
          done

          gh release upload "$TAG" release-assets/latest.json
          gh release edit "$TAG" --latest
          echo "METRIO_RELEASE_LATEST=$TAG" >> "$GITHUB_ENV"

      - name: Verify the live endpoint serves the new release
        run: |
          URL="https://github.com/$REPO/releases/latest/download/latest.json"
          for i in $(seq 1 30); do
            curl -fsSL "$URL" -o live-latest.json && \
              [ "$(node -p 'JSON.parse(require("fs").readFileSync("live-latest.json","utf8")).version')" = "$RELEASE_VERSION" ] && break
            echo "waiting for $URL to serve $RELEASE_VERSION ($i/30)"; sleep 10
          done
          cmp live-latest.json release-assets/latest.json
          echo "Live latest.json is version $RELEASE_VERSION and byte-identical to the verified manifest."

      - name: Roll back an unpublished release after a failure
        if: failure() && env.METRIO_TAG_PUSHED != '' && env.METRIO_RELEASE_LATEST == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Clients never saw this release (latest.json is uploaded last), so removing the
          # half-published release/tag is safe. Nothing that reached "latest" is ever touched.
          if [ -n "${METRIO_RELEASE_CREATED:-}" ]; then
            gh release delete "$METRIO_RELEASE_CREATED" --yes --cleanup-tag || true
          fi
          git push origin ":refs/tags/$METRIO_TAG_PUSHED" || true

