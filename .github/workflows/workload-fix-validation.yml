name: Workload fix validation

on:
  push:
    branches:
      - fix/workload-capacity-methodology

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Design system
        run: npm run verify:design-system
      - name: Unit tests
        run: npm test
      - name: Frontend build
        run: npm run build
      - name: Rust checks
        run: |
          cd src-tauri
          cargo check
          cargo test
